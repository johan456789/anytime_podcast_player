name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    permissions:
      contents: write # the release job creates GitHub Releases on v* tags
    uses: johan456789/ci-templates/.github/workflows/app-flutter.yml@v1
    with:
      platforms: '["android"]'
      flutter_version: '3.41.5' # pinned in pubspec.yaml; keep in sync
      analyze_args: --no-fatal-warnings # the repo carries a pre-existing issue baseline
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
